[project]
name = "spruce"
version = "0.7.3"
description = "Spruce - Solving Phases of the Rubik's cube."
authors = [
    { name = "Tufte, Martin Gudahl" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "numpy==2.5.1",
    "matplotlib==3.11.0",
    "attrs>=23.2.0",
    "typer>=0.12.5",
    "python-json-logger>=2.0.7",
    "cattrs>=26.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.16.2",
    "ty>=0.0.1a23",
    "pytest>=8.3.2",
    "pytest-cov>=7.1.0",
    "types-requests>=2.32.4.20250913",
]
app = [
    "streamlit>=1.55.0",
    "extra-streamlit-components==0.1.81",
    "st-annotated-text>=4.0.2",
]
experiments = [
    "tqdm>=4.67.1",
    "types-tqdm>=4.67.0.20250809",
    "pyvis>=0.3.2",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "SIM", "B", "C4", "C90", "FLY", "NPY", "PERF", "PL", "RUF", "YTT", "INP", "ERA", "TID", "TC", "N", "UP", "PT", "G", "T10", "T20", "COM", "PGH"]
ignore = [
    "COM812",   # Missing trailing comma; conflicts with the formatter
    "PLR0913",  # Too many arguments in a function
    "PLR0917",  # Too many positional arguments in a function
    "PLR2004",  # Magic value used in comparison
    "PLR0911",  # Too many return statements in a function
    "PLR0912",  # Too many branches in a function
    "PLR0915",  # Too many statements in a function
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"spruce/experiments/**/*.py" = ["T201", "G004", "BLE001"]
"spruce/pages.py" = ["BLE001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["spruce"]

[tool.ruff.lint.mccabe]
max-complexity = 30


[tool.typos.default.extend-words]
# Cubing terminology, not typos
oll = "oll"


[tool.pytest.ini_options]
addopts = "--cov=spruce --cov-report=term-missing"

[tool.coverage.run]
source = ["spruce"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ty]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
